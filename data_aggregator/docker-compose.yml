
services:
  web:
    build: .
    command: > 
      sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
  
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dbPostgres
      POSTGRES_USER: CustomUser
      POSTGRES_PASSWORD: postgress1
    ports:
      - "5432:5432"
    volumes:
      - "parser_pgdata:/var/lib/postgresql/data"
  
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
  
  celery_worker:
    build: .
    command: celery -A data_aggregator worker --loglevel=info

    volumes:
      - .:/app
    depends_on:
      - db
      - redis
  celery_beat:
    build: .
    command: celery -A data_aggregator beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - celery_worker

volumes:
  parser_pgdata: