{% extends "base.html" %}

{% block content %}
<div class="row">
    {% for article in articles %}
    <div class="col-md-8 mx-auto mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">
                    <a href="" class="text-decoration-none">article.title</a>
                </h5>
                <div class="d-flex gap-2 mb-2">
                    <a href="" class="btn btn-sm btn-success">↑</a>
                    <a href="" class="btn btn-sm btn-danger">↓</a>
                </div>
                <div class="card-text text-muted small">
                    <span class="badge bg-secondary">article.source</span>
                    <span class="ms-2">article.publication_date</span>
                    <span class="ms-2">Rating: article.rating</span>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p class="text-muted text-center">No articles available.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
