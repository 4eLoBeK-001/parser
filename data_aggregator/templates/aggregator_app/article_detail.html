{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title">{{ article.title }}</h1>
                <div class="mb-3">
                    <a href="{{ article.url }}" target="_blank" class="btn btn-primary">Читать оригинал</a>
                    <a href="" class="btn btn-success ms-2">↑ Нравится</a>
                    <a href="" class="btn btn-danger ms-2">↓ Не нравится</a>
                </div>
                <div class="text-muted mb-3">
                    <span class="badge bg-secondary">{{ article.source }}</span>
                    <span class="ms-2">Опубликовано: {{article.publication_date|date:"M d, Y H:i" }}</span>
                    <span class="ms-2">Рейтинг: {{ article.rating }}</span>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
